name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit-test:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # The player-card video iframe URL (DEV-46) is baked into the client
      # bundle at build time from this PUBLIC_ var. The artefact this job
      # produces is what e2e + Lighthouse run against, so it must be set or
      # the player falls back to its error state and the Stream specs can't
      # assert the iframe mounts. Use the real (public, non-secret) subdomain
      # when available; a stable placeholder otherwise keeps CI deterministic
      # on forks / when the secret is absent. The real production value lives
      # in the Cloudflare Pages deploy env.
      PUBLIC_STREAM_CUSTOMER_SUBDOMAIN: ${{ secrets.PUBLIC_STREAM_CUSTOMER_SUBDOMAIN || 'demo-customer' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    name: E2E + axe
    runs-on: ubuntu-latest
    needs: build
    env:
      # Skip Playwright's webServer build step — we serve the artefact
      # from the build job directly.
      BASE_URL: http://localhost:4321
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit firefox
      - name: Install OS deps when browsers are cached
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit firefox
      - name: Start preview server
        run: |
          pnpm exec astro preview &
          # Wait up to 30s for the server to come up.
          for i in {1..30}; do
            if curl -sf http://localhost:4321 -o /dev/null; then
              echo "Preview ready"
              exit 0
            fi
            sleep 1
          done
          echo "Preview server failed to start" >&2
          exit 1
      - name: Run Playwright suite
        run: pnpm e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          # Deliberately NOT temporaryPublicStorage: the report screenshots
          # capture children's first names + portraits from live content;
          # uploading them to an external public bucket would breach the
          # project's safeguarding rules. Results are surfaced via the PR
          # comment below (in-repo) and the .lighthouseci artifact instead.
          temporaryPublicStorage: false
      # Surface the asserted metrics inline on the PR so reviewers see the
      # scores (and per-run variance) without opening the run / downloading
      # the artifact. Parses the raw lhr-*.json (written during collect, so
      # present even when a budget assertion fails) — hence `if: always()`.
      - name: Comment Lighthouse results on the PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const dir = ".lighthouseci";

            let files = [];
            try {
              files = fs.readdirSync(dir).filter((f) => f.startsWith("lhr-") && f.endsWith(".json"));
            } catch (e) {
              core.warning(`No Lighthouse results directory: ${e.message}`);
              return;
            }
            if (files.length === 0) {
              core.warning("No lhr-*.json results to summarise.");
              return;
            }

            const byUrl = new Map();
            for (const f of files) {
              let lhr;
              try {
                lhr = JSON.parse(fs.readFileSync(path.join(dir, f), "utf8"));
              } catch {
                continue;
              }
              const full = lhr.requestedUrl || lhr.finalUrl || "";
              let urlPath = full;
              try {
                urlPath = new URL(full).pathname;
              } catch {}
              const a = lhr.audits || {};
              const run = {
                perf: lhr.categories?.performance?.score ?? null,
                fcp: a["first-contentful-paint"]?.numericValue ?? null,
                lcp: a["largest-contentful-paint"]?.numericValue ?? null,
                tbt: a["total-blocking-time"]?.numericValue ?? null,
                cls: a["cumulative-layout-shift"]?.numericValue ?? null,
              };
              if (!byUrl.has(urlPath)) byUrl.set(urlPath, []);
              byUrl.get(urlPath).push(run);
            }

            const median = (xs) => {
              const s = xs.filter((x) => x != null).sort((m, n) => m - n);
              return s.length ? s[Math.floor((s.length - 1) / 2)] : null;
            };
            const fmtMs = (v) => (v == null ? "—" : `${Math.round(v)} ms`);
            const fmtCls = (v) => (v == null ? "—" : v.toFixed(3));
            const fmtPerf = (v) => (v == null ? "—" : v.toFixed(2));
            const spread = (xs, fmt) => {
              const s = xs.filter((x) => x != null).sort((m, n) => m - n);
              if (s.length < 2 || s[0] === s[s.length - 1]) return "";
              return ` (${fmt(s[0])}–${fmt(s[s.length - 1])})`;
            };

            const order = ["/", "/letter", "/squad", "/about", "/voice/amina-ke-001"];
            const rank = (u) => (order.indexOf(u) < 0 ? 99 : order.indexOf(u));
            const urls = [...byUrl.keys()].sort((p, q) => rank(p) - rank(q));

            const rows = urls.map((u) => {
              const runs = byUrl.get(u);
              const perfs = runs.map((r) => r.perf);
              const clss = runs.map((r) => r.cls);
              const clsMax = Math.max(...clss.filter((x) => x != null), 0);
              const clsBreach = (median(clss) ?? 0) <= 0.1 && clsMax > 0.1 ? " ⚠️" : "";
              return `| \`${u}\` | ${fmtPerf(median(perfs))}${spread(perfs, fmtPerf)} | ${fmtMs(median(runs.map((r) => r.fcp)))} | ${fmtMs(median(runs.map((r) => r.lcp)))} | ${fmtMs(median(runs.map((r) => r.tbt)))} | ${fmtCls(median(clss))}${spread(clss, fmtCls)}${clsBreach} |`;
            });

            const marker = "<!-- lighthouse-ci-comment -->";
            const body = [
              "## 🔦 Lighthouse CI — median of 3 runs",
              "",
              "Budgets (gate = median-run): perf ≥ 0.85 · FCP ≤ 1500 ms · LCP ≤ 2500 ms · TBT ≤ 200 ms · CLS ≤ 0.1.",
              "",
              "| URL | Perf | FCP | LCP | TBT | CLS |",
              "| --- | --- | --- | --- | --- | --- |",
              ...rows,
              "",
              "<sub>Ranges show the per-run spread. ⚠️ = a non-median run breached the CLS budget (the median still gates). Numbers come from the ubuntu CI runner against the localhost `astro preview` build — indicative, not the Cloudflare Pages preview (DEV-8).</sub>",
              marker,
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
